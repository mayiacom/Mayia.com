services:
  - type: web
    name: mayia
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false

