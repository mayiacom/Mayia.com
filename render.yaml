services:
  - type: web
    name: mayia
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: sandbox
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_PRICE_WEEKLY
        sync: false
      - key: CASHFREE_PRICE_MONTHLY
        sync: false
      - key: CASHFREE_PRICE_STUDIO
        sync: false
      - key: CASHFREE_PRICE_ANNUAL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://mayia-az6g.onrender.com

